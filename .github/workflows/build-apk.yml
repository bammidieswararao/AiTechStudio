name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# needed to publish the APK files as a GitHub Release (that is what gives a direct .apk link)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: your own signing key for the release APK, so updates install over the old version.
      # Add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to use it.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/studio.jks"
            echo "STUDIO_KEYSTORE=$RUNNER_TEMP/studio.jks" >> "$GITHUB_ENV"
            echo "STUDIO_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "STUDIO_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "STUDIO_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # Builds the debug APK (for testing) and the release APK in one go.
      # First try with the offline speech engine (Vosk) for word-timed captions.
      - name: Build APKs (with offline speech engine)
        id: with_vosk
        continue-on-error: true
        run: gradle :app:assembleDebug :app:assembleRelease -PwithVosk=true --stacktrace

      # If Vosk could not be fetched, build again without it. Everything else still works.
      - name: Build APKs (without speech engine)
        if: steps.with_vosk.outcome == 'failure'
        run: gradle :app:assembleDebug :app:assembleRelease -PwithVosk=false --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk   dist/AiTech-Studio-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/AiTech-Studio-release.apk
          ls -la dist

      # Publish as a GitHub Release. Release files are plain .apk files with a direct download link.
      - name: Publish release with direct APK links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AiTech-Studio-debug.apk dist/AiTech-Studio-release.apk --clobber
          else
            gh release create "$TAG" dist/AiTech-Studio-debug.apk dist/AiTech-Studio-release.apk \
              --target "${{ github.sha }}" \
              --title "AiTech Studio build ${{ github.run_number }}" \
              --notes "Install **AiTech-Studio-debug.apk** to test. **AiTech-Studio-release.apk** is the normal build. Built from commit ${{ github.sha }}." \
              --latest
          fi
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          {
            echo "### Direct APK links (always the newest build)"
            echo ""
            echo "- Debug (for testing): ${BASE}/AiTech-Studio-debug.apk"
            echo "- Release: ${BASE}/AiTech-Studio-release.apk"
            echo ""
            echo "This build only: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Backup: the same files as a zipped workflow artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: AiTech-Studio-APKs
          path: dist/*.apk
          if-no-files-found: error
